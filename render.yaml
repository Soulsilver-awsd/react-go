databases:
  - name: multicatalogo-db
    plan: free
    databaseName: multicatalogo
    user: multicatalogo
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: web
    name: multicatalogo-backend
    runtime: docker
    plan: free
    region: oregon
    branch: fase-4
    dockerfilePath: ./multicatalogo-backend/Dockerfile
    dockerContext: ./multicatalogo-backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multicatalogo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: multicatalogo-frontend
    runtime: static
    branch: fase-4
    rootDir: ./Practica03_a_05_de_la_Unidad
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://multicatalogo-backend-opcs.onrender.com
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: multicatalogo-db
    plan: free
    databaseName: multicatalogo
    user: multicatalogo
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: web
    name: multicatalogo-backend
    runtime: docker
    plan: free
    region: oregon
    branch: fase-4
    dockerfilePath: ./multicatalogo-backend/Dockerfile
    dockerContext: ./multicatalogo-backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multicatalogo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
